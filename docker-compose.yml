services:
  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DECKCHECK_API_PORT: "3001"
      DECKCHECK_APP_PASSWORD: ${DECKCHECK_APP_PASSWORD:?Defina DECKCHECK_APP_PASSWORD no arquivo .env}
      DECKCHECK_DB_PATH: /data/deckcheck.sqlite
      DECKCHECK_OCR_LANGUAGES: eng+por
      DECKCHECK_SECURE_COOKIES: ${DECKCHECK_SECURE_COOKIES:-false}
    volumes:
      - deckcheck_data:/data

  proxy:
    build:
      context: .
      target: proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "8080:8080"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles:
      - public
    depends_on:
      - proxy
    command:
      - http
      - proxy:8080
      - --url=https://${NGROK_AGENT_DOMAIN:-default.internal}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}

volumes:
  deckcheck_data:
